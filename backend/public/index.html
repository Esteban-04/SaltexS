<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALTEX Monitor Backend API</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
    }
    a:hover { background: #0369a1; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● SERVICIO ACTIVO</div>
    <h1>SALTEX Monitor Backend</h1>
    <p>La API del backend está activa. Para ver la aplicación web completa con el mapa interactivo y el monitor de servidores, asegúrate de desplegar desde la raíz del repositorio en Vercel.</p>
    <a href="/api/health">Ver Estado de la API (/api/health)</a>
  </div>
</body>
</html>
